<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI チャット</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #8cabd9; /* LINE風の背景色 */
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: #7494c0;
      display: flex;
      flex-direction: column;
    }
    /* ヘッダー */
    .chat-header {
      background-color: #273246;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }
    /* APIキー入力エリア */
    .api-key-box {
      background-color: #ffffff;
      padding: 10px 15px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #ccc;
    }
    .api-key-box input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    /* メッセージ一覧エリア */
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* 吹き出しの共通スタイル */
    .message {
      display: flex;
      max-width: 80%;
      word-break: break-word;
    }
    .message-content {
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    /* 自分のメッセージ（右寄せ・緑） */
    .message.user {
      align-self: flex-end;
    }
    .message.user .message-content {
      background-color: #8de055;
      color: #000;
      border-top-right-radius: 2px;
    }
    /* AIのメッセージ（左寄せ・白） */
    .message.bot {
      align-self: flex-start;
    }
    .message.bot .message-content {
      background-color: #ffffff;
      color: #000;
      border-top-left-radius: 2px;
    }
    /* 入力フォームエリア */
    .chat-input-area {
      background-color: #ffffff;
      padding: 10px 15px;
      display: flex;
      gap: 10px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }
    .chat-input-area button {
      background-color: #35c400;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .chat-input-area button:disabled {
      background-color: #ccc;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">AI アシスタント</div>
  <!-- チャットメッセージ表示エリア -->
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="message-content">こんにちは！何かお手伝いできることはありますか？</div>
    </div>
  </div>

  <!-- テキスト入力＆送信ボタン -->
  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button id="sendBtn" onclick="sendMessage()">送信</button>
  </div>
</div>

<script>
  // 画面読み込み時にローカルストレージからAPIキーを取得、なければサーバー等から取得を試みる
  window.addEventListener('DOMContentLoaded', async () => {
    let apiKey = localStorage.getItem('gemini_api_key');
    console.log("APIKEY:" + apiKey);
    
    if (!apiKey) {
      try {
        const response = await fetch("api/gemini");
        const data = await response.json();
        if (response.ok) {
          apiKey = data.apiKey;
          localStorage.setItem('gemini_api_key', apiKey);
        } else {
          console.log('サーバーからのAPIキー取得に失敗しました。');
        }
      } catch (error) {
        console.log('APIキーの自動取得スキップ（または通信エラー）');
      }
    }
  });
</script>
<script>
  async function sendMessage() {
    const apiKeyInput = document.getElementById('apiKey');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');
    const sendBtn = document.getElementById('sendBtn');
    const text = userInput.value.trim();
    const apiKey = localStorage.getItem('gemini_api_key');

    if (!text) return;

    // 1. ユーザーのメッセージを画面に追加
    addMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;

    // 2. AIの返信待ちメッセージを表示
    const loadingMessageEl = addMessage('考え中...', 'bot');

    try {
      // 3. Gemini APIへリクエスト送信 (gemini-2.5-flashモデルを使用)
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: text }]
          }]
        })
      });

      const data = await response.json();
      console.log(JSON.stringify(data, null, 2));

      if (data.error) {
        loadingMessageEl.querySelector('.message-content').textContent = `エラー: ${data.error.message}`;
      } else {
        const aiResponse = data.candidates[0].content.parts[0].text;
        loadingMessageEl.querySelector('.message-content').textContent = aiResponse;
      }
    } catch (error) {
      loadingMessageEl.querySelector('.message-content').textContent = '通信エラーが発生しました。';
      console.error(error);
    } finally {
      sendBtn.disabled = false;
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  }

  function addMessage(text, sender) {
    const chatMessages = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.classList.add('message', sender);

    const contentDiv = document.createElement('div');
    contentDiv.classList.add('message-content');
    contentDiv.textContent = text;

    messageDiv.appendChild(contentDiv);
    chatMessages.appendChild(messageDiv);

    // 一番下までスクロール
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return messageDiv;
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }
</script>

</body>
</html>
